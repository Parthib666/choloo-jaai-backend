services:

  postgres:
    image: postgres:16
    container_name: choloo-postgres
    restart: always
    environment:
      POSTGRES_USER: choloo
      POSTGRES_PASSWORD: choloo_password
      POSTGRES_DB: choloo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: choloo-redis
    restart: always
    ports:
      - "6379:6379"


volumes:

  postgres_data: